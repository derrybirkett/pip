name: Validate Documentation

on:
  pull_request:
    paths:
      - '**.md'
      - 'patterns/**'
      - 'docs/**'
      - 'ia/**'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'patterns/**'
      - 'docs/**'
      - 'ia/**'

jobs:
  structure-validation:
    name: Validate Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate agent manifest YAML
        run: ruby -e 'require "yaml"; YAML.load_file("ia/agent_manifest.yml"); puts "ia/agent_manifest.yml OK"'

      - name: Validate relative Markdown links
        run: python3 .github/scripts/validate_relative_links.py
