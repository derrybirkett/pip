name: Autonomous Roadmap Agent

on:
  issue_comment:
    types: [created]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '14'
    - name: Run autonomous agent
      run: node .github/agents/autonomous-agent.js