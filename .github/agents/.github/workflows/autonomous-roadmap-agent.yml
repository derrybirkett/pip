name: Autonomous Roadmap Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Run autonomous agent
        run: |
          cd ${{ github.workspace }}
          node .github/agents/autonomous-agent.js